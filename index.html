<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b1055">
<title>ทอยลูกเต๋าตัดเพื่อน</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;color:#fff;background:#1a0b3b}
#app{position:relative;width:100%;height:100%;max-width:520px;margin:0 auto;background:linear-gradient(160deg,#2b1055,#7597de 130%);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.screen.active{display:flex}
button{font-family:inherit;cursor:pointer;border:0}
.btn{background:linear-gradient(180deg,#ffd54a,#ff9f1c);color:#3b1a00;font-weight:800;font-size:1.25rem;padding:14px 22px;border-radius:18px;box-shadow:0 5px 0 #b86a00,0 8px 16px rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b86a00}
.btn:disabled{opacity:.45}
.btn.alt{background:linear-gradient(180deg,#8be9fd,#33b5e5);color:#00263a;box-shadow:0 5px 0 #1b7396,0 8px 16px rgba(0,0,0,.35)}
.icon{background:rgba(255,255,255,.18);color:#fff;font-size:1.5rem;width:46px;height:46px;border-radius:14px;line-height:1}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:46px}
h1,h2{margin:0}
.title{text-align:center;font-size:2rem;font-weight:800;margin:10px 0 14px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
/* screen 1 */
#s1 .logo{height:40%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#s1 .logo .die{font-size:5.5rem;animation:bob 2s ease-in-out infinite}
#s1 .logo h1{font-size:2.3rem;line-height:1.15;text-shadow:0 4px 0 rgba(0,0,0,.35)}
#s1 .credit{text-align:center;margin-top:24px;font-size:1.05rem;line-height:1.7;opacity:.95}
#s1 .grow{flex:1}
@keyframes bob{50%{transform:translateY(-10px) rotate(8deg)}}
/* screen 2 */
#names{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
#names input{width:100%;font-family:inherit;font-size:1.15rem;padding:12px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff;outline:0}
#names input::placeholder{color:rgba(255,255,255,.6)}
#names input:focus{border-color:#ffd54a}
#err{color:#ffd1d1;text-align:center;min-height:1.4em;margin:6px 0}
/* screen 3 */
#plist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.pcard{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-radius:14px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.2);font-size:1.15rem;font-weight:700;transition:.2s}
.pcard .sc{font-size:1.3rem;color:#ffd54a}
.pcard.turn{border-color:#fff176;background:rgba(255,241,118,.22);box-shadow:0 0 12px 3px #fff176,0 0 28px 8px rgba(255,214,0,.55) inset;animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 8px 2px #fff176,0 0 14px 2px rgba(255,214,0,.3) inset}to{box-shadow:0 0 20px 6px #fff176,0 0 30px 8px rgba(255,214,0,.6) inset}}
#ctrl{height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#msg{font-size:1.05rem;min-height:1.4em;text-align:center}
#dice{width:110px;height:110px;background:#fff;border-radius:22px;box-shadow:0 8px 0 #bbb,0 12px 20px rgba(0,0,0,.4);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px;cursor:pointer}
#dice.roll{animation:shake .25s linear infinite}
@keyframes shake{25%{transform:rotate(-12deg) translateY(-6px)}75%{transform:rotate(12deg) translateY(-6px)}}
#dice i{width:20px;height:20px;border-radius:50%;background:#222;place-self:center;visibility:hidden}
#dice i.on{visibility:visible}
#game.gray{filter:grayscale(1) brightness(.55);pointer-events:none}
#win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:40px;z-index:5;text-align:center;padding:24px}
#win.show{display:flex}
#win h2{font-size:2.2rem;text-shadow:0 3px 8px #000;line-height:1.3}
/* screen 4 */
#rank{flex:1;overflow:auto;padding:4px 0}
table{width:100%;border-collapse:collapse;font-size:1.15rem}
th,td{padding:11px 10px;text-align:left}
th{background:rgba(255,255,255,.2)}
th:first-child,td:first-child{text-align:center;width:60px}
th:last-child,td:last-child{text-align:right}
tbody tr{background:rgba(255,255,255,.1)}
tbody tr:nth-child(even){background:rgba(255,255,255,.18)}
tbody tr.first{background:rgba(255,213,74,.35);font-weight:800}
.row{display:flex;gap:12px}
.row .btn{flex:1;font-size:1.05rem;padding:14px 8px}
/* screen 5 */
.set{background:rgba(255,255,255,.14);border-radius:18px;padding:16px;margin-bottom:14px}
.set label{display:block;font-weight:700;margin-bottom:10px;font-size:1.1rem}
.step{display:flex;align-items:center;justify-content:center;gap:18px}
.step button{width:52px;height:52px;border-radius:50%;font-size:1.8rem;font-weight:800;background:#ffd54a;color:#3b1a00}
.step span{min-width:84px;text-align:center;font-size:1.8rem;font-weight:800}
/* modal */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:6;padding:20px}
#modal.show{display:flex}
#mbox{background:#3a1f6e;border:2px solid #ffd54a;border-radius:22px;padding:20px;width:100%;max-height:85%;overflow:auto;display:flex;flex-direction:column;gap:12px}
#mbox h3{margin:0;text-align:center;font-size:1.3rem}
#mbox .btn{font-size:1.1rem}
</style>
</head>
<body>
<div id="app">

<!-- หน้าจอ 1 -->
<section class="screen active" id="s1">
  <div class="topbar"><span></span><button class="icon" data-go="5" title="ตั้งค่า">⚙</button></div>
  <div class="logo"><div class="die">🎲</div><h1>ทอยลูกเต๋า<br>ตัดเพื่อน!</h1></div>
  <div class="credit">จัดทำโดย<br>นางสาวสิริรัตน์ โคตระ 016930641021-1</div>
  <div class="grow"></div>
  <button class="btn" data-go="2">ไปเล่นกันนน</button>
</section>

<!-- หน้าจอ 2 -->
<section class="screen" id="s2">
  <div class="topbar"><button class="icon" data-go="1">&lt;</button><button class="icon" data-go="5" title="ตั้งค่า">⚙</button></div>
  <div class="title">รวมพลเพื่อน!</div>
  <div id="names"></div>
  <div id="err"></div>
  <button class="btn" id="ready">พร้อมแล้ววว</button>
</section>

<!-- หน้าจอ 3 -->
<section class="screen" id="s3">
  <div id="game" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="topbar"><button class="icon" data-go="1">&lt;</button><div id="goal" style="font-weight:700"></div><span style="width:46px"></span></div>
    <div id="plist"></div>
    <div id="ctrl">
      <button class="btn" id="startBtn">เริ่ม!</button>
      <div id="dice" style="display:none"></div>
      <div id="msg"></div>
    </div>
  </div>
  <div id="win"><h2 id="winTxt"></h2><button class="btn alt" data-go="4">ผลการแข่งขันนน</button></div>
</section>

<!-- หน้าจอ 4 -->
<section class="screen" id="s4">
  <div class="title" style="margin-top:20px">ลำดับคะแนนน</div>
  <div id="rank"></div>
  <div class="row">
    <button class="btn alt" id="again">&lt;เล่นอีกกก</button>
    <button class="btn" id="restart">^เริ่มใหม่กัน!</button>
  </div>
</section>

<!-- หน้าจอ 5 -->
<section class="screen" id="s5">
  <div class="topbar"><div style="font-size:1.6rem;font-weight:800">ตั้งค่า</div><button class="icon" id="closeSet">X</button></div>
  <div style="height:14px"></div>
  <div class="set"><label>จำนวนผู้เล่น (2–10 คน)</label>
    <div class="step"><button data-k="players" data-d="-1">−</button><span id="v_players"></span><button data-k="players" data-d="1">+</button></div></div>
  <div class="set"><label>เวลาที่ลูกเต๋าสุ่ม (1–10 วินาที)</label>
    <div class="step"><button data-k="rollSec" data-d="-1">−</button><span id="v_rollSec"></span><button data-k="rollSec" data-d="1">+</button></div></div>
  <div class="set"><label>คะแนนสูงสุดที่ชนะในแต่ละรอบ</label>
    <div class="step"><button data-k="target" data-d="-5">−</button><span id="v_target"></span><button data-k="target" data-d="5">+</button></div></div>
</section>

<div id="modal"><div id="mbox"></div></div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const LIM={players:[2,10],rollSec:[1,10],target:[10,500]};
let settings={players:4,rollSec:3,target:50};
try{const s=JSON.parse(localStorage.getItem('dice_settings')||'null');if(s)settings=Object.assign(settings,s)}catch(e){}
const save=()=>{try{localStorage.setItem('dice_settings',JSON.stringify(settings))}catch(e){}};

let names=[],scores=[],cur=0,started=false,rolling=false,over=false;
let screen=1,prev=1,playersAtOpen=0;

function go(n){
  if(n===5){prev=screen;playersAtOpen=settings.players;renderSettings()}
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));
  $('#s'+n).classList.add('active');
  screen=n;
  if(n===2)renderNames();
  if(n===3)renderGame();
  if(n===4)renderRank();
}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
  const n=+b.dataset.go;
  if(n===3&&!over){} 
  go(n);
}));

/* ---- หน้า 2 ---- */
function renderNames(){
  const box=$('#names');
  const old=[...box.querySelectorAll('input')].map(i=>i.value);
  box.innerHTML='';
  for(let i=0;i<settings.players;i++){
    const inp=document.createElement('input');
    inp.placeholder='ชื่อผู้เล่นคนที่ '+(i+1);
    inp.maxLength=20;
    inp.value=old[i]!==undefined?old[i]:(names[i]||'');
    box.appendChild(inp);
  }
  $('#err').textContent='';
}
$('#ready').addEventListener('click',()=>{
  const vals=[...document.querySelectorAll('#names input')].map(i=>i.value.trim());
  if(vals.some(v=>!v)){$('#err').textContent='กรอกชื่อให้ครบทุกช่องก่อนนะ';return}
  if(new Set(vals).size!==vals.length){$('#err').textContent='ห้ามใช้ชื่อซ้ำกันนะ';return}
  names=vals;
  newRound();
  go(3);
});

/* ---- หน้า 3 ---- */
function newRound(){
  scores=names.map(()=>0);cur=0;started=false;rolling=false;over=false;
}
function renderGame(){
  $('#goal').textContent='เป้าหมาย '+settings.target+' แต้ม';
  $('#game').classList.toggle('gray',over);
  $('#win').classList.toggle('show',over);
  const l=$('#plist');l.innerHTML='';
  names.forEach((n,i)=>{
    const d=document.createElement('div');
    d.className='pcard'+(started&&!over&&i===cur?' turn':'');
    d.innerHTML='<span></span><span class="sc"></span>';
    d.children[0].textContent=(i+1)+'. '+n;
    d.children[1].textContent=scores[i];
    l.appendChild(d);
  });
  $('#startBtn').style.display=started?'none':'';
  $('#dice').style.display=started?'':'none';
  if(started&&!over)$('#msg').textContent='ตาของ '+names[cur]+' — แตะลูกเต๋าเพื่อทอย!';
  else if(!started)$('#msg').textContent='';
  if(started&&!rolling&&!$('#dice').children.length)drawFace(1);
  const t=l.querySelector('.turn');if(t)t.scrollIntoView({block:'nearest'});
  if(over)$('#winTxt').textContent=names[scores.findIndex(s=>s>=settings.target)]+'เป็นผู้ชนะ!!!';
}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function drawFace(n){
  const d=$('#dice');d.innerHTML='';
  for(let i=0;i<9;i++){const p=document.createElement('i');if(PIPS[n].includes(i))p.className='on';d.appendChild(p)}
}
$('#startBtn').addEventListener('click',()=>{started=true;drawFace(1);renderGame()});
$('#dice').addEventListener('click',()=>{
  if(!started||rolling||over)return;
  rolling=true;
  const d=$('#dice');d.classList.add('roll');
  $('#msg').textContent='กำลังทอย...';
  const iv=setInterval(()=>drawFace(1+Math.floor(Math.random()*6)),90);
  setTimeout(()=>{
    clearInterval(iv);d.classList.remove('roll');
    const r=1+Math.floor(Math.random()*6);
    drawFace(r);
    rolling=false;
    afterRoll(r);
  },settings.rollSec*1000);
});
function checkWin(){
  if(scores.some(s=>s>=settings.target)){over=true;renderGame();return true}
  return false;
}
function nextTurn(){cur=(cur+1)%names.length;renderGame()}
function afterRoll(r){
  scores[cur]+=r;
  renderGame();
  $('#msg').textContent=names[cur]+' ทอยได้ '+r+' แต้ม';
  if(checkWin())return;
  if(scores[cur]%10===0&&scores[cur]>0){
    setTimeout(()=>special(),600);
  }else{
    setTimeout(nextTurn,900);
  }
}
/* ตัวเลือกพิเศษ */
function showModal(html){const m=$('#mbox');m.innerHTML='';m.appendChild(html);$('#modal').classList.add('show')}
function hideModal(){$('#modal').classList.remove('show')}
function mk(txt,cls,fn){const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=txt;b.onclick=fn;return b}
function special(){
  const w=document.createElement('div');w.style.cssText='display:flex;flex-direction:column;gap:12px';
  const h=document.createElement('h3');h.textContent=names[cur]+' ได้ '+scores[cur]+' แต้ม! เลือกเลย';w.appendChild(h);
  w.appendChild(mk('แกไม่รอดแน่! (ตัดแต้มใครก็ได้ 3 แต้ม)','',()=>pick('cut')));
  w.appendChild(mk('ทำบุญทำทาน (แบ่งแต้มให้ใครก็ได้ 3 แต้ม)','alt',()=>pick('give')));
  w.appendChild(mk('เล่นต่อดีกว่าาา','alt',()=>{hideModal();nextTurn()}));
  showModal(w);
}
function pick(kind){
  const w=document.createElement('div');w.style.cssText='display:flex;flex-direction:column;gap:10px';
  const h=document.createElement('h3');h.textContent=kind==='cut'?'ตัดแต้มใคร?':'แบ่งแต้มให้ใคร?';w.appendChild(h);
  names.forEach((n,i)=>{
    if(i===cur)return;
    w.appendChild(mk(n+' ('+scores[i]+')','alt',()=>{
      if(kind==='cut')scores[i]=Math.max(0,scores[i]-3);
      else{const g=Math.min(3,scores[cur]);scores[cur]-=g;scores[i]+=g}
      hideModal();renderGame();
      if(checkWin())return;
      nextTurn();
    }));
  });
  w.appendChild(mk('< ย้อนกลับ','',special));
  showModal(w);
}

/* ---- หน้า 4 ---- */
function renderRank(){
  const order=names.map((n,i)=>({n,s:scores[i]})).sort((a,b)=>b.s-a.s);
  let h='<table><thead><tr><th>#</th><th>ชื่อ</th><th>คะแนน</th></tr></thead><tbody>';
  order.forEach((o,i)=>{h+='<tr class="'+(i===0?'first':'')+'"><td>'+(i+1)+'</td><td></td><td>'+o.s+'</td></tr>'});
  h+='</tbody></table>';
  $('#rank').innerHTML=h;
  [...$('#rank').querySelectorAll('tbody tr')].forEach((tr,i)=>tr.children[1].textContent=order[i].n);
}
$('#again').addEventListener('click',()=>{newRound();go(3)});
$('#restart').addEventListener('click',()=>go(2));

/* ---- หน้า 5 ---- */
function renderSettings(){
  for(const k in settings)$('#v_'+k).textContent=settings[k]+(k==='rollSec'?' วิ':k==='players'?' คน':'');
}
document.querySelectorAll('.step button').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.k,[lo,hi]=LIM[k];
  settings[k]=Math.min(hi,Math.max(lo,settings[k]+ +b.dataset.d));
  save();renderSettings();
}));
$('#closeSet').addEventListener('click',()=>{
  let back=prev;
  if(settings.players!==playersAtOpen&&(back===3||back===4)){back=2;names=names.slice(0,settings.players)}
  go(back);
});

go(1);
})();
</script>
</body>
</html>
